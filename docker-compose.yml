version: '3.8'

services:
  mongodb:
    image: mongo:7-alpine
    container_name: task-manager-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-backend
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://root:password@mongodb:27017/task-manager?authSource=admin
      MONGODB_TEST_URI: mongodb://root:password@mongodb:27017/task-manager-test?authSource=admin
      JWT_ACCESS_SECRET: dev_access_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: pnpm run dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
